<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photo & Location Capture (With Consent)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.9rem;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    video, canvas {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
    button {
      margin-top: 10px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #startBtn {
      background: #2563eb;
      color: #fff;
    }
    #captureBtn {
      background: #16a34a;
      color: #fff;
    }
    #downloadBtn {
      background: #6b7280;
      color: #fff;
      display: none;
    }
    .status {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #555;
    }
    .coords {
      margin-top: 8px;
      font-size: 0.9rem;
      background: #f9fafb;
      padding: 8px;
      border-radius: 8px;
      word-wrap: break-word;
    }
    a {
      color: #2563eb;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Photo & Location Capture</h1>
    <p>
      This page will ask for access to your <strong>front camera</strong> and <strong>location</strong>.
      Your photo and coordinates are visible only to you unless you choose to share them.
    </p>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <button id="startBtn">Start Camera</button>
    <button id="captureBtn" disabled>Capture Photo & Location</button>
    <button id="downloadBtn">Download Captured Image</button>

    <div id="status" class="status"></div>
    <div id="coords" class="coords" style="display:none;"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusEl = document.getElementById('status');
    const coordsEl = document.getElementById('coords');

    let stream = null;
    let lastImageDataUrl = null;

    async function startCamera() {
      try {
        statusEl.textContent = 'Requesting camera access...';
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' }, // front camera if available
          audio: false
        });
        video.srcObject = stream;
        captureBtn.disabled = false;
        statusEl.textContent = 'Camera started. Align your face and tap "Capture Photo & Location".';
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Could not access camera. Please check permissions.';
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    function capturePhoto() {
      const width = video.videoWidth;
      const height = video.videoHeight;

      if (!width || !height) {
        statusEl.textContent = 'Camera not ready yet. Please wait a moment and try again.';
        return;
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);

      // Show canvas instead of video (optional)
      canvas.style.display = 'block';
      video.style.display = 'none';

      // Store image as data URL
      lastImageDataUrl = canvas.toDataURL('image/png');
      downloadBtn.style.display = 'inline-block';
      statusEl.textContent = 'Photo captured. Getting your location (if allowed)...';

      // Now get location
      if (!navigator.geolocation) {
        statusEl.textContent = 'Geolocation is not supported by this browser.';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude, accuracy } = pos.coords;
          const mapsLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
          coordsEl.style.display = 'block';
          coordsEl.innerHTML = `
            <strong>Coordinates:</strong><br>
            Latitude: ${latitude.toFixed(6)}<br>
            Longitude: ${longitude.toFixed(6)}<br>
            Accuracy: ±${Math.round(accuracy)} meters<br><br>
            <strong>Maps link:</strong><br>
            <a href="${mapsLink}" target="_blank" rel="noopener noreferrer">${mapsLink}</a>
          `;
          statusEl.textContent = 'Photo and location captured successfully. You can download the image or share this info.';
        },
        err => {
          console.error(err);
          statusEl.textContent = 'Photo captured, but could not get location: ' + err.message;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function downloadImage() {
      if (!lastImageDataUrl) {
        statusEl.textContent = 'No image captured yet.';
        return;
      }
      const a = document.createElement('a');
      a.href = lastImageDataUrl;
      a.download = 'captured_photo.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Event listeners
    startBtn.addEventListener('click', startCamera);
    captureBtn.addEventListener('click', capturePhoto);
    downloadBtn.addEventListener('click', downloadImage);

    // Stop camera when page is closed/reloaded
    window.addEventListener('beforeunload', stopCamera);
  </script>
</body>
</html>
